<!-- Supabase sends people here from the "Reset your password" email. The link carries a short-lived
     recovery session in the URL fragment; it is read once, then removed from the address bar. -->
<section class="confirm reset" id="form-view" hidden>
  <h1 data-t="title"></h1>
  <p data-t="intro"></p>
  <form id="reset-form" novalidate>
    <label for="pw1" data-t="new"></label>
    <input id="pw1" type="password" autocomplete="new-password" minlength="8" required>
    <label for="pw2" data-t="again"></label>
    <input id="pw2" type="password" autocomplete="new-password" minlength="8" required>
    <p class="hint" data-t="hint"></p>
    <p class="error" id="form-error" role="alert" hidden></p>
    <button class="store" type="submit" id="save" data-t="save"></button>
  </form>
</section>

<section class="confirm" id="done-view" hidden>
  <svg class="confirm-icon ok" viewBox="0 0 76 76" aria-hidden="true">
    <circle cx="38" cy="38" r="38"/><path d="M23 39l10 10 20-22" fill="none" stroke="#fff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  </svg>
  <h1 data-t="doneTitle"></h1>
  <p data-t="doneBody"></p>
  <a class="store open-app" id="open-app" href="com.nutrilme.app://auth-callback?next=/you" hidden data-t="open"></a>
</section>

<section class="confirm failed" id="bad-view" hidden>

</section>

    // An expired or used link arrives with error details instead of a session.
    var frag = new URLSearchParams(location.hash.replace(/^#/, ""));
    var query = new URLSearchParams(location.search);
    if (frag.get("error") || frag.get("error_code") || query.get("error")) {
      history.replaceState(null, "", location.pathname);
      return show("bad-view");
    }
    if (!window.supabase) return show("bad-view");

    var client = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY, {
      auth: { flowType: "implicit", detectSessionInUrl: true, persistSession: false, autoRefreshToken: false }

    client.auth.getSession().then(function (res) {
      // The recovery tokens are in memory now: take them out of the address bar and history.
      history.replaceState(null, "", location.pathname);
      if (!res.data || !res.data.session) return show("bad-view");
      show("form-view");
    });
