<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reset password | Nutril Me</title>
<meta name="description" content="Choose a new password for your Nutril Me account.">
<meta name="robots" content="noindex">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src https://cdn.jsdelivr.net 'self'; connect-src https://iafwmpajzvsdaosfilnb.supabase.co; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self'; base-uri 'none'; form-action 'none'">
<link rel="icon" href="/icon.png">
<link rel="apple-touch-icon" href="/icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js" integrity="sha384-0w2KAL2YHP6wKOkUDzkCDGgVvfmHnj02DHeQ6XcHOgTfFsGyonKOpShMH1x6nk9o" crossorigin="anonymous"></script>
</head>
<body>
<header class="top">
  <div class="wrap bar">
    <a class="brand" href="/"><img src="/icon.png" alt="" width="40" height="40"><span><b>Nutril</b> <i>Me</i></span></a>
    <nav><a href="/">Home</a><a href="/support/">Support</a><a href="/privacy/">Privacy</a><a href="/terms/">Terms</a></nav>
  </div>
</header>
<main class="wrap doc">
<!-- Supabase sends people here from the "Reset your password" email. The link carries a short-lived
     recovery session in the URL fragment; it is read once, then removed from the address bar. -->
<section class="confirm reset" id="form-view" hidden>
  <h1 data-t="title"></h1>
  <p data-t="intro"></p>
  <form id="reset-form" novalidate>
    <label for="pw1" data-t="new"></label>
    <input id="pw1" type="password" autocomplete="new-password" minlength="8" required>
    <label for="pw2" data-t="again"></label>
    <input id="pw2" type="password" autocomplete="new-password" minlength="8" required>
    <p class="hint" data-t="hint"></p>
    <p class="error" id="form-error" role="alert" hidden></p>
    <button class="store" type="submit" id="save" data-t="save"></button>
  </form>
</section>

<section class="confirm" id="done-view" hidden>
  <svg class="confirm-icon ok" viewBox="0 0 76 76" aria-hidden="true">
    <circle cx="38" cy="38" r="38"/><path d="M23 39l10 10 20-22" fill="none" stroke="#fff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  </svg>
  <h1 data-t="doneTitle"></h1>
  <p data-t="doneBody"></p>
  <a class="store open-app" id="open-app" href="com.nutrilme.app://auth-callback?next=/you" hidden data-t="open"></a>
</section>

<section class="confirm failed" id="bad-view" hidden>
  <svg class="confirm-icon bad" viewBox="0 0 76 76" aria-hidden="true">
    <circle cx="38" cy="38" r="38"/><path d="M38 20v22" stroke="#fff" stroke-width="7" stroke-linecap="round"/><circle cx="38" cy="55" r="4.5" fill="#fff"/>
  </svg>
  <h1 data-t="badTitle"></h1>
  <p data-t="badBody"></p>
</section>

<noscript>
  <section class="confirm">
    <h1>Reset password</h1>
    <p>Please turn on JavaScript to choose a new password, or contact support@nutrilmeapp.com.</p>
  </section>
</noscript>
<script src="reset.js"></script>

</main>
<footer class="foot">
  <div class="wrap">
    <nav><a href="/">Home</a><a href="/support/">Support</a><a href="/privacy/">Privacy</a><a href="/terms/">Terms</a></nav>
    <p>© 2026 Nutril Me · <a href="mailto:support@nutrilmeapp.com">support@nutrilmeapp.com</a></p>
  </div>
</footer>
</body>
</html>
